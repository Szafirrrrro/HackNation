services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # Neo4j Browser: http://localhost:7474
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/hackathon123
    volumes:
      - neo4j_data:/data

  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: scamgraph
      POSTGRES_DB: scamgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scamgraph}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "scamgraph", "-d", "scamgraph"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  neo4j_data:
  postgres_data:
