services:
  neo4j:
    image: neo4j:5
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
    volumes:
      - neo4j_data:/data

  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: scamgraph
      POSTGRES_USER: scamgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "scamgraph", "-d", "scamgraph"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  neo4j_data:
  postgres_data:
